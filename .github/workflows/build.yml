name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # Software Vulkan driver, so the GPU tests run against the shader on Linux.
    # They are required there and skip on the other runners, which have none.
    - name: Install lavapipe
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -v .

    - name: Test
      env:
        GALVANITY_REQUIRE_VULKAN: ${{ runner.os == 'Linux' && '1' || '' }}
      run: go test -v ./...

    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: galvanity-${{ matrix.platform }}
        path: ./galvanity*
